<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="popup.css">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<title>Ads Blocker</title>
</head>

<body>
    <main>

        <!-- rating stuff -->
        <header class="brand-row">
            <div class="brand">
                <span class="shield" id="shield" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2.5 4 5.5v6c0 5.1 3.4 8.9 8 10 4.6-1.1 8-4.9 8-10v-6L12 2.5Z"
                              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                        <path class="shield-check" d="M8.5 12.3l2.4 2.4 4.6-4.9"
                              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span class="shield-glow" aria-hidden="true"></span>
                </span>
                <div class="brand-text">
                    <p id="logo">Ads Blocker</p>
                    <p id="tagline">Currently blocking ads</p>
                </div>
            </div>

            <div id="ratingDiv">
                <p id="rateUsTXT">Rate us</p>
                <div id="starRating" role="radiogroup" aria-label="Rate this extension">
                    <button class="star" type="button" data-value="1" aria-label="1 star">★</button>
                    <button class="star" type="button" data-value="2" aria-label="2 stars">★</button>
                    <button class="star" type="button" data-value="3" aria-label="3 stars">★</button>
                    <button class="star" type="button" data-value="4" aria-label="4 stars">★</button>
                    <button class="star" type="button" data-value="5" aria-label="5 stars">★</button>
                </div>
            </div>
        </header>

        <!-- stat stuff -->
        <section class="stats-row">
            <div class="stat-main">
                <span class="stat-number" id="blockedCount">0</span>
                <span class="stat-label">ads blocked today</span>
            </div>
            <div class="stat-side">
                <span class="stat-side-number" id="blockedTotal">0</span>
                <span class="stat-side-label">all time</span>
            </div>
        </section>

        <!-- toggle thing -->
        <section class="status-row">
            <div class="status-copy">
                <p class="status-title">Protection</p>
                <p class="status-sub" id="statusText">Enabled on this site</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="toggle" checked>
                <span class="slider"></span>
            </label>
        </section>

        <!-- the footer -->
        <footer class="footer-row">
            <button class="footer-link" id="settingsBtn" type="button">Settings</button>
            <span class="footer-divider" aria-hidden="true">•</span>
            <button class="footer-link" id="reportBtn" type="button">Report an issue</button>
        </footer>

    </main>

<script src="script.js"></script>
</body>
</html>
